<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Spawn Logo: Connected Nodes Network -->
  
  <!-- Connection lines to center -->
  <line x1="100" y1="100" x2="100" y2="40" stroke="#3B82F6" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="100" x2="152" y2="70" stroke="#3B82F6" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="100" x2="152" y2="130" stroke="#3B82F6" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="100" x2="100" y2="160" stroke="#3B82F6" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="100" x2="48" y2="130" stroke="#3B82F6" stroke-width="2.5" opacity="0.7"/>
  <line x1="100" y1="100" x2="48" y2="70" stroke="#3B82F6" stroke-width="2.5" opacity="0.7"/>
  
  <!-- Outer hexagon connections -->
  <line x1="100" y1="40" x2="152" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.35"/>
  <line x1="152" y1="70" x2="152" y2="130" stroke="#3B82F6" stroke-width="2" opacity="0.35"/>
  <line x1="152" y1="130" x2="100" y2="160" stroke="#3B82F6" stroke-width="2" opacity="0.35"/>
  <line x1="100" y1="160" x2="48" y2="130" stroke="#3B82F6" stroke-width="2" opacity="0.35"/>
  <line x1="48" y1="130" x2="48" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.35"/>
  <line x1="48" y1="70" x2="100" y2="40" stroke="#3B82F6" stroke-width="2" opacity="0.35"/>
  
  <!-- Outer nodes -->
  <circle cx="100" cy="40" r="10" fill="#3B82F6"/>
  <circle cx="152" cy="70" r="10" fill="#3B82F6"/>
  <circle cx="152" cy="130" r="10" fill="#3B82F6"/>
  <circle cx="100" cy="160" r="10" fill="#3B82F6"/>
  <circle cx="48" cy="130" r="10" fill="#3B82F6"/>
  <circle cx="48" cy="70" r="10" fill="#3B82F6"/>
  
  <!-- Central node (verified agent) -->
  <circle cx="100" cy="100" r="24" fill="#3B82F6"/>
  <circle cx="100" cy="100" r="16" fill="#1E3A8A"/>
  
  <!-- Checkmark -->
  <path d="M92 100 L97 105 L108 94" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
