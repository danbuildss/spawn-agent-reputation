<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Concept B: Trust Shield with Network Pattern -->
  <!-- Shield shape with internal node network -->
  
  <!-- Shield outline -->
  <path d="M100 25 L160 50 L160 110 C160 140 140 165 100 180 C60 165 40 140 40 110 L40 50 L100 25Z" 
        fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="3"/>
  
  <!-- Inner shield -->
  <path d="M100 45 L145 63 L145 105 C145 128 130 148 100 160 C70 148 55 128 55 105 L55 63 L100 45Z" 
        fill="#3B82F6" fill-opacity="0.3"/>
  
  <!-- Network nodes inside shield -->
  <circle cx="100" cy="90" r="6" fill="#3B82F6"/>
  <circle cx="80" cy="110" r="4" fill="#3B82F6"/>
  <circle cx="120" cy="110" r="4" fill="#3B82F6"/>
  <circle cx="100" cy="130" r="4" fill="#3B82F6"/>
  <circle cx="75" cy="85" r="3" fill="#60A5FA"/>
  <circle cx="125" cy="85" r="3" fill="#60A5FA"/>
  
  <!-- Connection lines -->
  <line x1="100" y1="90" x2="80" y2="110" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="90" x2="120" y2="110" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="80" y1="110" x2="100" y2="130" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="110" x2="100" y2="130" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="90" x2="75" y2="85" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="90" x2="125" y2="85" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
</svg>
