<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Concept A: Connected Nodes Network -->
  <!-- Central node with 6 connected outer nodes forming a trust network -->
  
  <!-- Connection lines -->
  <line x1="100" y1="100" x2="100" y2="40" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="100" x2="152" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="100" x2="152" y2="130" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="100" x2="100" y2="160" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="100" x2="48" y2="130" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="100" x2="48" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  
  <!-- Outer connections (between outer nodes) -->
  <line x1="100" y1="40" x2="152" y2="70" stroke="#3B82F6" stroke-width="1.5" opacity="0.3"/>
  <line x1="152" y1="70" x2="152" y2="130" stroke="#3B82F6" stroke-width="1.5" opacity="0.3"/>
  <line x1="152" y1="130" x2="100" y2="160" stroke="#3B82F6" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="160" x2="48" y2="130" stroke="#3B82F6" stroke-width="1.5" opacity="0.3"/>
  <line x1="48" y1="130" x2="48" y2="70" stroke="#3B82F6" stroke-width="1.5" opacity="0.3"/>
  <line x1="48" y1="70" x2="100" y2="40" stroke="#3B82F6" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Outer nodes -->
  <circle cx="100" cy="40" r="8" fill="#3B82F6"/>
  <circle cx="152" cy="70" r="8" fill="#3B82F6"/>
  <circle cx="152" cy="130" r="8" fill="#3B82F6"/>
  <circle cx="100" cy="160" r="8" fill="#3B82F6"/>
  <circle cx="48" cy="130" r="8" fill="#3B82F6"/>
  <circle cx="48" cy="70" r="8" fill="#3B82F6"/>
  
  <!-- Central node (larger, represents the verified agent) -->
  <circle cx="100" cy="100" r="20" fill="#3B82F6"/>
  <circle cx="100" cy="100" r="12" fill="#1E3A8A"/>
  
  <!-- Checkmark in center -->
  <path d="M94 100 L98 104 L106 96" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
